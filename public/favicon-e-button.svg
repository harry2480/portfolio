<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" fill="#050505"/>

  <!-- Button panel frame -->
  <rect x="16" y="12" width="32" height="40" fill="#1a1a1a" stroke="#333" stroke-width="1.5" rx="4"/>

  <!-- Upper button (inactive) -->
  <circle cx="32" cy="24" r="7" fill="none" stroke="#666" stroke-width="1.5"/>
  <polygon points="32,20 35,26 29,26" fill="#999"/>

  <!-- Lower button (active/lit) -->
  <circle cx="32" cy="42" r="7" fill="#FF0033" opacity="0.3" stroke="#FF0033" stroke-width="2"/>
  <polygon points="32,46 35,40 29,40" fill="#FF0033"/>

  <!-- Indicator light ring (active) -->
  <circle cx="32" cy="42" r="9" fill="none" stroke="#FF0033" stroke-width="0.5" opacity="0.6"/>

  <!-- Highlight on button -->
  <circle cx="30" cy="40" r="2" fill="#FF0033" opacity="0.7"/>
</svg>