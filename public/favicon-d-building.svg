<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" fill="#050505"/>

  <!-- Building silhouette base -->
  <g fill="#e0e0e0">
    <!-- Left tower -->
    <rect x="12" y="20" width="12" height="32" fill="#e0e0e0"/>
    <rect x="14" y="22" width="4" height="4" fill="#FF0033"/>
    <rect x="20" y="22" width="2" height="4" fill="#1a1a1a"/>
    <rect x="14" y="28" width="4" height="4" fill="#FF0033"/>
    <rect x="20" y="28" width="2" height="4" fill="#1a1a1a"/>
    <rect x="14" y="34" width="4" height="4" fill="#1a1a1a"/>
    <rect x="20" y="34" width="2" height="4" fill="#FF0033"/>
    <rect x="14" y="40" width="4" height="4" fill="#1a1a1a"/>
    <rect x="20" y="40" width="2" height="4" fill="#1a1a1a"/>

    <!-- Right tower -->
    <rect x="40" y="24" width="12" height="28" fill="#e0e0e0"/>
    <rect x="42" y="26" width="4" height="4" fill="#FF0033"/>
    <rect x="48" y="26" width="2" height="4" fill="#1a1a1a"/>
    <rect x="42" y="32" width="4" height="4" fill="#1a1a1a"/>
    <rect x="48" y="32" width="2" height="4" fill="#FF0033"/>
    <rect x="42" y="38" width="4" height="4" fill="#1a1a1a"/>
    <rect x="48" y="38" width="2" height="4" fill="#1a1a1a"/>
    <rect x="42" y="44" width="4" height="4" fill="#FF0033"/>
    <rect x="48" y="44" width="2" height="4" fill="#1a1a1a"/>
  </g>

  <!-- Center tower (taller) -->
  <rect x="26" y="14" width="12" height="38" fill="#999"/>
  <rect x="28" y="16" width="3" height="4" fill="#0033FF"/>
  <rect x="32" y="16" width="3" height="4" fill="#1a1a1a"/>
  <rect x="28" y="22" width="3" height="4" fill="#0033FF"/>
  <rect x="32" y="22" width="3" height="4" fill="#0033FF"/>
  <rect x="28" y="28" width="3" height="4" fill="#1a1a1a"/>
  <rect x="32" y="28" width="3" height="4" fill="#0033FF"/>
  <rect x="28" y="34" width="3" height="4" fill="#0033FF"/>
  <rect x="32" y="34" width="3" height="4" fill="#1a1a1a"/>
  <rect x="28" y="40" width="3" height="4" fill="#0033FF"/>
  <rect x="32" y="40" width="3" height="4" fill="#0033FF"/>

  <!-- Ground line -->
  <line x1="6" y1="52" x2="58" y2="52" stroke="#FF0033" stroke-width="1"/>
</svg>