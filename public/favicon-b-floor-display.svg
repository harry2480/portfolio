<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" fill="#050505"/>

  <!-- Display panel frame -->
  <rect x="8" y="14" width="48" height="36" fill="none" stroke="#333" stroke-width="1.5" rx="3"/>

  <!-- Display background -->
  <rect x="10" y="16" width="44" height="32" fill="#0a0a0a"/>

  <!-- Grid/dot matrix pattern (LED style) -->
  <g fill="#00FF41" opacity="0.8">
    <!-- Top row -->
    <circle cx="18" cy="22" r="1.5"/>
    <circle cx="28" cy="22" r="1.5"/>
    <circle cx="38" cy="22" r="1.5"/>
    <circle cx="48" cy="22" r="1.5"/>

    <!-- Middle row -->
    <circle cx="18" cy="30" r="1.5"/>
    <circle cx="28" cy="30" r="1.5"/>
    <circle cx="38" cy="30" r="1.5"/>
    <circle cx="48" cy="30" r="1.5"/>

    <!-- Bottom row -->
    <circle cx="18" cy="38" r="1.5"/>
    <circle cx="28" cy="38" r="1.5"/>
    <circle cx="38" cy="38" r="1.5"/>
    <circle cx="48" cy="38" r="1.5"/>
  </g>

  <!-- Red floor indicator light -->
  <circle cx="54" cy="20" r="2" fill="#FF0033"/>

  <!-- Top red accent line -->
  <line x1="8" y1="12" x2="56" y2="12" stroke="#FF0033" stroke-width="1"/>
</svg>