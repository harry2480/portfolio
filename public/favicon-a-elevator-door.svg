<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" fill="#050505"/>

  <!-- Left door panel -->
  <g>
    <rect x="6" y="10" width="22" height="44" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <!-- Horizontal ridges on left door -->
    <line x1="8" y1="16" x2="26" y2="16" stroke="#333" stroke-width="0.5" opacity="0.5"/>
    <line x1="8" y1="22" x2="26" y2="22" stroke="#333" stroke-width="0.5" opacity="0.5"/>
    <line x1="8" y1="28" x2="26" y2="28" stroke="#333" stroke-width="0.5" opacity="0.5"/>
    <line x1="8" y1="34" x2="26" y2="34" stroke="#333" stroke-width="0.5" opacity="0.5"/>
    <line x1="8" y1="40" x2="26" y2="40" stroke="#333" stroke-width="0.5" opacity="0.5"/>
    <line x1="8" y1="46" x2="26" y2="46" stroke="#333" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Right door panel -->
  <g>
    <rect x="36" y="10" width="22" height="44" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <!-- Horizontal ridges on right door -->
    <line x1="38" y1="16" x2="56" y2="16" stroke="#333" stroke-width="0.5" opacity="0.5"/>
    <line x1="38" y1="22" x2="56" y2="22" stroke="#333" stroke-width="0.5" opacity="0.5"/>
    <line x1="38" y1="28" x2="56" y2="28" stroke="#333" stroke-width="0.5" opacity="0.5"/>
    <line x1="38" y1="34" x2="56" y2="34" stroke="#333" stroke-width="0.5" opacity="0.5"/>
    <line x1="38" y1="40" x2="56" y2="40" stroke="#333" stroke-width="0.5" opacity="0.5"/>
    <line x1="38" y1="46" x2="56" y2="46" stroke="#333" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Center red line (door crack/indicator) -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="#FF0033" stroke-width="1.5"/>

  <!-- Top indicator light -->
  <circle cx="32" cy="8" r="1.5" fill="#FF0033"/>
</svg>